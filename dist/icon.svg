<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#820A14"/>
      <stop offset="100%" stop-color="#5A0410"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCE09B"/>
      <stop offset="100%" stop-color="#E5A642"/>
    </linearGradient>
    <linearGradient id="vermilionGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7518"/>
      <stop offset="100%" stop-color="#DC3F00"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Base Rounded Container -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  
  <!-- Subtle Outer Sacred Ring -->
  <circle cx="256" cy="256" r="190" stroke="#F4A261" stroke-width="4" stroke-dasharray="14 10" opacity="0.35"/>
  <circle cx="256" cy="256" r="215" stroke="#FCE09B" stroke-width="1.5" opacity="0.2"/>

  <!-- Trinetra / Sacred Companion Wave Intertwined Path -->
  <!-- Path 1: Vermilion Guidance Path -->
  <path d="M150 360 C150 270, 235 295, 256 256 C277 217, 362 242, 362 152" 
        stroke="url(#vermilionGrad)" stroke-width="38" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>

  <!-- Path 2: Golden Companion Path -->
  <path d="M192 152 C192 217, 245 217, 256 256 C267 295, 320 295, 320 360" 
        stroke="url(#goldGrad)" stroke-width="30" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Central Nexus (Songi Junction / Third Eye Spark) -->
  <circle cx="256" cy="256" r="32" fill="#FFFDF8" stroke="#DC3F00" stroke-width="10"/>
  <circle cx="256" cy="256" r="14" fill="#6C020E"/>

  <!-- Sacred North & South Spark Nodes -->
  <circle cx="362" cy="152" r="18" fill="#FFFDF8" stroke="#E5A642" stroke-width="6"/>
  <circle cx="150" cy="360" r="18" fill="#FFFDF8" stroke="#DC3F00" stroke-width="6"/>
  <circle cx="192" cy="152" r="12" fill="#FCE09B"/>
  <circle cx="320" cy="360" r="12" fill="#FF7518"/>
</svg>
